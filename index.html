<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>김근육쌤의 업무도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, 체육교사의 작업실
   IDEA 헬스장 웨이트존: 고무 바닥, 바벨, 색깔 원판 = 분류
   PICTURE 헤더 아래를 가로지르는 바벨, 분류마다 원판 한 장
   COLOUR 고무매트 차콜 바탕, 원판 5색(빨강·파랑·노랑·초록·흰색), 쇠 회색
   TYPE Black Han Sans 제목 + Noto Sans KR 본문
   LAYOUT 위: 제목+바벨 밴드 / 가운데: 검색·원판 필터 패널 / 아래: 카드 그리드, 폰에선 1열 */
:root{color-scheme:light dark;--bg:light-dark(#ecebe7,#121315);--card:light-dark(#ffffff,#1d1f22);--ink:light-dark(#17181a,#eeeeec);--mute:light-dark(#5c5f66,#a3a7ad);--line:light-dark(#d6d4cf,#33363b);--mat:#1b1c1f;--steel:#b9bec6;
--c1:#d7263d;--c2:#1f5fd1;--c3:#f2b705;--c4:#1e9e5a;--c5:#e9e9e6}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.top{background:var(--mat);color:#f4f4f2;position:relative;padding:clamp(32px,5vw,60px) max(5vw,16px) 150px;background-image:repeating-linear-gradient(90deg,transparent 0 119px,#26282c 119px 121px),repeating-linear-gradient(0deg,transparent 0 119px,#26282c 119px 121px)}
.wrap{max-width:1140px;margin:0 auto}
h1{font:400 clamp(38px,6.4vw,64px)/1.05 "Black Han Sans",sans-serif;margin:0 0 14px;letter-spacing:-.01em;text-wrap:balance}
.lead{margin:0;color:#c9ccd1;font-size:17px;max-width:34em}
.by{margin:16px 0 0;color:var(--c3);font-weight:700}
.bar{position:absolute;left:0;right:0;bottom:-6px;height:150px;pointer-events:none}
.bar svg{width:100%;height:100%;display:block}
main{padding:0 max(5vw,16px) 64px}
.panel{position:relative;z-index:2;margin:-18px auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgb(0 0 0/.12)}
#q{width:100%;font:16px "Noto Sans KR",sans-serif;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
#q:focus{outline:none;border-color:var(--c1)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 8px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 15px "Noto Sans KR",sans-serif;cursor:pointer}
.chip i{width:26px;height:26px;border-radius:50%;background:var(--k,#888);box-shadow:inset 0 0 0 5px rgb(0 0 0/.18),inset 0 0 0 9px var(--k,#888),inset 0 0 0 10px rgb(0 0 0/.35);flex:none}
.chip b{font-weight:500;color:var(--mute);font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed=true] b{color:inherit;opacity:.7}
.chip:focus-visible{outline:3px solid var(--c3);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--k)}
.thumb{height:140px;border-radius:10px;background:var(--mat);display:grid;place-items:center;overflow:hidden;margin-bottom:6px}
.thumb svg{width:100%;height:100%}
.meta{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.meta strong{color:var(--ink)}
.tag{font-size:13px;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--c3) 22%,transparent)}
.card h3{margin:0;font:400 22px/1.2 "Black Han Sans",sans-serif}
.card p{margin:0;color:var(--mute);font-size:15px}
.go{margin-top:auto;padding-top:8px;font-weight:700;font-size:15px;text-decoration:underline;text-decoration-color:var(--k);text-decoration-thickness:3px;text-underline-offset:5px}
.empty{border-style:dashed;background:transparent}
.empty .thumb{background:transparent;border:2px dashed var(--line)}
.none{margin-top:28px;color:var(--mute)}
.note{margin-top:28px;font-size:13px;color:var(--mute)}
footer{padding:24px max(5vw,16px);border-top:1px solid var(--line);color:var(--mute);font-size:14px;text-align:center}
@media(max-width:600px){.top{padding-bottom:120px}.bar{height:118px}.grid{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:no-preference){.plate{transform-box:fill-box;transform-origin:center;animation:drop .7s cubic-bezier(.3,1.5,.5,1) both}}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>김근육쌤의 업무도구</h1>
    <p class="lead">수업과 학교 업무를 하다가 필요해서 직접 만든 도구들이에요. 회원가입 없이 누구나 무료로 쓸 수 있어요.</p>
    <p class="by">by 김근육쌤</p>
  </div>
  <div class="bar" aria-hidden="true"><svg id="bar"></svg></div>
</header>
<main>
  <div class="wrap">
    <section class="panel">
      <label for="q" style="position:absolute;left:-9999px">프로그램 찾기</label>
      <input id="q" type="search" placeholder="프로그램 찾기 (예: 품의문, 나이스)" autocomplete="off">
      <div class="chips" id="chips" role="group" aria-label="분류"></div>
    </section>
    <div class="grid" id="grid"></div>
    <p class="none" id="none" hidden>찾는 도구가 없어요. 다른 단어로 검색해 보세요.</p>
    <p class="note">점선 카드는 아직 도구가 등록되지 않은 빈 자리예요.</p>
  </div>
</main>
<footer>김근육쌤의 업무도구 · 문의는 학교 메신저로 주세요</footer>
<script>
{
/* 분류: 원판 색과 짝지어요 */
const CATS=[
  {id:'pe',name:'체육수업',k:'var(--c1)'},
  {id:'gian',name:'에듀파인 기안문',k:'var(--c2)'},
  {id:'pum',name:'에듀파인 품의문',k:'var(--c3)'},
  {id:'neis',name:'나이스',k:'var(--c4)'},
  {id:'club',name:'스포츠클럽',k:'var(--c5)'}
];
/* 도구 목록: 여기에 하나씩 추가하면 카드가 생겨요
   {cat:'pum', name:'도구 이름', type:'웹앱', desc:'한 줄 소개', url:'https://...', guideOnly:false} */
const TOOLS=[];

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const catOf=id=>CATS.find(c=>c.id===id)||CATS[0];
let cur='all';
const q=document.getElementById('q'),grid=document.getElementById('grid'),chips=document.getElementById('chips'),none=document.getElementById('none');

const plateSvg=k=>`<svg viewBox="0 0 200 140" preserveAspectRatio="xMidYMid meet"><rect x="0" y="66" width="200" height="8" fill="#b9bec6"/><circle cx="100" cy="70" r="52" fill="${k}"/><circle cx="100" cy="70" r="52" fill="none" stroke="rgb(0 0 0/.25)" stroke-width="8"/><circle cx="100" cy="70" r="30" fill="rgb(0 0 0/.18)"/><circle cx="100" cy="70" r="11" fill="#b9bec6"/><circle cx="100" cy="70" r="5" fill="#1b1c1f"/></svg>`;

function drawChips(){
  const n=id=>id==='all'?TOOLS.length:TOOLS.filter(t=>t.cat===id).length;
  chips.innerHTML=[{id:'all',name:'전체',k:'#8a8f97'},...CATS].map(c=>`<button class="chip" type="button" data-id="${c.id}" aria-pressed="${cur===c.id}" style="--k:${c.k}"><i></i>${esc(c.name)} <b>${n(c.id)}</b></button>`).join('');
}
function drawGrid(){
  const term=q.value.trim().toLowerCase();
  const list=TOOLS.filter(t=>(cur==='all'||t.cat===cur)&&(!term||[t.name,t.desc,t.type,catOf(t.cat).name].join(' ').toLowerCase().includes(term)));
  let html=list.map(t=>{const c=catOf(t.cat);const tag=t.url?'a':'div';
    return `<${tag} class="card" style="--k:${c.k}"${t.url?` href="${esc(t.url)}" target="_blank" rel="noopener"`:''}><div class="thumb">${plateSvg(c.k)}</div><div class="meta"><strong>${esc(c.name)}</strong>${esc(t.type)}${t.guideOnly?'<span class="tag">가이드만 공개</span>':''}</div><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p>${t.url?`<span class="go">${t.guideOnly?'사용 가이드 보기':'바로 쓰기'}</span>`:''}</${tag}>`}).join('');
  if(!term){
    const cats=cur==='all'?CATS:CATS.filter(c=>c.id===cur);
    html+=cats.filter(c=>!TOOLS.some(t=>t.cat===c.id)).map(c=>`<div class="card empty" style="--k:${c.k}"><div class="thumb">${plateSvg(c.k)}</div><div class="meta"><strong>${esc(c.name)}</strong>웹앱</div><h3>곧 들어올 도구</h3><p>${esc(c.name)} 도구가 이 자리에 올라와요.</p></div>`).join('');
  }
  grid.innerHTML=html;
  none.hidden=!!html;
}
chips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cur=b.dataset.id;try{localStorage.setItem('kgm-cat',cur)}catch(_){};drawChips();drawGrid()});
q.addEventListener('input',drawGrid);
try{const s=localStorage.getItem('kgm-cat');if(s&&(s==='all'||CATS.some(c=>c.id===s)))cur=s}catch(_){}

/* 헤더 바벨 */
const s=document.getElementById('bar');
const drawBar=()=>{
  const W=s.clientWidth,H=s.clientHeight;if(!W)return;
  const cy=H*0.55,sc=Math.min(1,W/900);
  const sizes=[1,.92,.84,.74,.62].map(v=>v*H*0.42);
  const thick=Math.max(12,22*sc),cols=['--c1','--c2','--c3','--c4','--c5'];
  const inner=W*0.5-Math.max(130,W*0.2);
  let g=`<defs><linearGradient id="st" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3e6ea"/><stop offset="1" stop-color="#7d828a"/></linearGradient></defs>`;
  g+=`<ellipse cx="${W/2}" cy="${H-4}" rx="${W*0.46}" ry="7" fill="rgb(0 0 0/.35)"/>`;
  g+=`<rect x="${W*0.02}" y="${cy-5}" width="${W*0.96}" height="10" rx="5" fill="url(#st)"/>`;
  const side=(dir)=>{let x=W/2+dir*inner,out=`<rect x="${dir>0?x-10:x}" y="${cy-14}" width="10" height="28" rx="3" fill="url(#st)"/>`;
    sizes.forEach((r,i)=>{const px=dir>0?x:x-thick;out+=`<g class="plate" style="animation-delay:${i*90}ms"><rect x="${px}" y="${cy-r}" width="${thick}" height="${r*2}" rx="${thick*0.35}" fill="var(${cols[i]})"/><rect x="${px}" y="${cy-r}" width="${thick*0.28}" height="${r*2}" rx="3" fill="rgb(255 255 255/.28)"/><rect x="${px+thick*0.72}" y="${cy-r}" width="${thick*0.28}" height="${r*2}" rx="3" fill="rgb(0 0 0/.25)"/></g>`;x+=dir*(thick+3)});
    out+=`<rect x="${dir>0?x:x-14}" y="${cy-16}" width="14" height="32" rx="4" fill="#3a3d42"/>`;return out};
  g+=side(1)+side(-1);
  s.setAttribute('viewBox',`0 0 ${W} ${H}`);s.innerHTML=g;
};
const ro=new ResizeObserver(drawBar);ro.observe(s);
drawChips();drawGrid();
}
</script>
</body>
</html>
